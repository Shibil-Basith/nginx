<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS and JavaScript</title>
</head>

<body style="font-family: Arial; text-align: center; margin-top: 100px;">

    <h1 style="color: blue;">Hello, World!</h1>

    <p id="message" style="font-size: 20px;">
        Welcome to my website.
    </p>

    <button
        style="padding: 10px 20px; background: red; color: white; border: none; cursor: pointer;"
        onclick="document.getElementById('message').innerHTML = 'Button Clicked!';">
        Click Me
    </button>

</body>
</html>
